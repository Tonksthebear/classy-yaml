# The engine layer of the "components" suite: made-up component classes with the key shapes that
# a component library uses (base keys, nested size, color and axis keys, and lists of strings).
dialog:
  main: "fixed inset-0 z-50 overflow-y-auto bg-transparent p-0"
  backdrop: "fixed inset-0 bg-black/40 transition-opacity duration-200 data-closed:opacity-0"
  container:
    base: "flex min-h-full items-end justify-center p-6 text-center sm:p-2"
    # placement axis
    centered: "sm:items-center sm:justify-center"
    bottom: "sm:items-end overflow-clip"
    # width axis
    default: ""
    wide: "items-stretch sm:px-10 lg:px-12"
    sheet: "max-sm:items-end p-0 sm:p-8"
  panel:
    base: "relative rounded-xl bg-white text-left shadow-lg transition-all duration-200 data-closed:opacity-0 sm:w-full sm:max-w-md dark:bg-zinc-900"
    # placement axis
    centered: "sm:my-10 data-closed:translate-y-2 data-closed:sm:scale-90"
    bottom: "rounded-b-none data-closed:translate-y-8"
    # width axis
    default: ""
    wide: "flex rounded-none sm:rounded-xl sm:my-12 sm:max-w-2xl data-closed:scale-110"
    # scroll axis
    scrollable: "flex flex-col h-[90dvh] sm:h-auto sm:max-h-[80dvh]"
    sheet_scrollable: "flex flex-col sm:h-auto sm:max-h-[80dvh]"
    not_scrollable: ""
    clipped: "overflow-clip"
    not_clipped: ""
    # padding axis
    padded: "px-5 py-6 sm:p-8"
    sheet_padded: "sm:p-8"
    sheet: "p-0 sm:my-10 sm:rounded-xl sm:pb-0 sm:[transform:none] data-closed:sm:translate-y-0"
  sheet_handle: "md:hidden"
  title: "text-lg font-bold text-zinc-900 dark:text-zinc-50"
  description: "text-sm text-zinc-600 dark:text-zinc-300"
  dismiss: "rounded-full p-1 text-zinc-500 hover:text-zinc-700 focus:outline-2 focus:outline-blue-500"
  header: "shrink-0 border-b border-zinc-200 px-5 py-3 sm:px-8"
  body: "flex-1 overflow-y-auto px-5 py-3 sm:px-8"
  footer: "shrink-0 border-t border-zinc-200 px-5 py-3 sm:flex sm:flex-row-reverse sm:gap-3 sm:px-8"

sheet:
  panel: "relative flex w-full flex-col rounded-t-3xl bg-white shadow-2xl [transform:translateY(var(--drag-y,0px))] transition-transform duration-300 data-closed:translate-y-full dark:bg-zinc-900"
  overflow:
    default: "overflow-x-clip overflow-y-scroll"
    scrollable: "overflow-auto"
  handle: "sticky top-0 flex md:flex h-10 items-center justify-center bg-white"
  handle_bar: "h-1.5 w-10 rounded-full bg-zinc-300"

btn:
  base: "inline-flex items-center justify-center gap-2 font-medium disabled:opacity-40 focus-visible:outline-2"
  # sizes, each with shape variants
  xs:
    base: "rounded px-2 py-0.5 text-xs"
    rounded: "rounded-full px-3 py-0.5 text-xs"
    circular: "rounded-full p-0.5 aspect-square"
  sm:
    base: "rounded px-2.5 py-1 text-sm"
    rounded: "rounded-full px-3 py-1 text-sm"
    circular: "rounded-full p-1 aspect-square"
  md:
    base: "rounded-lg px-3 py-2 text-sm"
    rounded: "rounded-full px-4 py-2 text-sm"
    circular: "rounded-full p-2 aspect-square"
  lg:
    base: "rounded-lg px-4 py-2.5 text-base"
    rounded: "rounded-full px-5 py-2.5 text-base"
    circular: "rounded-full p-2.5 aspect-square"
  xl:
    base: "rounded-xl px-5 py-3 text-lg gap-3"
    rounded: "rounded-full px-6 py-3 text-lg gap-3"
    circular: "rounded-full p-3 aspect-square"
  # colors, each with style variants
  primary:
    solid: "bg-blue-600 text-white shadow-sm hover:bg-blue-700 focus-visible:outline-blue-600"
    soft: "bg-blue-100 text-blue-700 hover:bg-blue-200"
    outline: "border border-blue-500 text-blue-600 hover:bg-blue-50"
    ghost: "text-blue-600 hover:bg-blue-100"
  secondary:
    solid: "bg-violet-600 text-white shadow-sm hover:bg-violet-700 focus-visible:outline-violet-600"
    soft: "bg-violet-100 text-violet-700 hover:bg-violet-200"
    outline: "border border-violet-500 text-violet-600 hover:bg-violet-50"
    ghost: "text-violet-600 hover:bg-violet-100"
  neutral:
    solid: "bg-white text-zinc-900 shadow-sm ring-1 ring-zinc-300 hover:bg-zinc-50"
    soft: "bg-zinc-100 text-zinc-800 hover:bg-zinc-200 dark:bg-zinc-800 dark:text-zinc-100"
    outline: "border border-zinc-300 text-zinc-700 hover:bg-zinc-50"
    ghost: "text-zinc-700 hover:bg-zinc-100"
  warning:
    solid: "bg-amber-500 text-black shadow-sm hover:bg-amber-400 focus-visible:outline-amber-500"
    soft: "bg-amber-100 text-amber-800 hover:bg-amber-200"
    outline: "border border-amber-500 text-amber-700 hover:bg-amber-50"
    ghost: "text-amber-700 hover:bg-amber-100"
  danger:
    solid: "bg-red-600 text-white shadow-sm hover:bg-red-700 focus-visible:outline-red-600"
    soft: "bg-red-100 text-red-700 hover:bg-red-200"
    outline: "border border-red-500 text-red-600 hover:bg-red-50"
    ghost: "text-red-600 hover:bg-red-100"

select:
  container: "relative"
  group: "px-4 py-1 text-xs font-bold uppercase text-zinc-500"
  default:
    button:
      - "grid w-full grid-cols-1 rounded-lg bg-white py-2.5 pr-3 pl-4 text-left text-zinc-900 outline-1 outline-zinc-300 focus-visible:outline-2 focus-visible:outline-blue-500"
      - "aria-invalid:text-red-800 aria-invalid:outline-red-400"
      - "dark:bg-zinc-900 dark:text-zinc-100 dark:outline-zinc-700"
    selected: "col-start-1 row-start-1 pr-8 text-ellipsis"
    icon:
      - "col-start-1 row-start-1 size-4 self-center justify-self-end text-zinc-400"
      - "aria-invalid:text-red-500"
    menu: "max-h-72 w-full overflow-y-auto rounded-lg bg-white py-2 shadow-md ring-1 ring-black/10 origin-top"
    option:
      container: "relative cursor-pointer py-2 pr-10 pl-4 select-none focus:bg-blue-600 focus:text-white"
      label: "block truncate group-aria-selected:font-bold"
      check: "absolute inset-y-0 right-0 flex items-center pr-3 text-blue-600"
  primary:
    button:
      - "grid w-full grid-cols-1 rounded-lg bg-blue-50 py-2.5 pr-3 pl-4 text-left text-blue-900 outline-1 outline-blue-300 focus-visible:outline-2 focus-visible:outline-blue-600"
      - "aria-invalid:bg-white aria-invalid:text-red-800 aria-invalid:outline-red-400"
    selected: "col-start-1 row-start-1 pr-8 text-ellipsis"
    icon:
      - "col-start-1 row-start-1 size-4 self-center justify-self-end text-blue-400"
      - "aria-invalid:text-red-500"
    menu: "max-h-72 w-full overflow-y-auto rounded-lg bg-blue-50 py-2 shadow-md ring-1 ring-blue-900/10 origin-top"
    option:
      container: "relative cursor-pointer py-2 pr-10 pl-4 select-none focus:bg-blue-700 focus:text-white"
      label: "block truncate group-aria-selected:font-bold"
      check: "absolute inset-y-0 right-0 flex items-center pr-3 text-blue-700"
